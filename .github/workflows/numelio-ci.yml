name: Numelio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: numelio_v4
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: numelio_v4/package-lock.json
      - name: Instalar dependencias
        run: npm install
      - name: Guardar lockfile actualizado en la rama de trabajo
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Actualizar lockfile de dependencias"
            git push origin "HEAD:$PR_BRANCH"
          fi
      - name: Guardar lockfile actualizado para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numelio-package-lock
          path: numelio_v4/package-lock.json
          if-no-files-found: error
      - name: Revisar vulnerabilidades de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Comprobar sintaxis del servidor
        run: npm run check
      - name: Ejecutar pruebas de seguridad y rutas públicas
        run: npm test
