<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceder a Numelio</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-container {
      max-width: 440px;
      margin: 60px auto;
      padding: 28px;
      border: 1px solid #30303b;
      border-radius: 18px;
      background: #15151d;
      color: #fff;
    }
    .auth-container h1 { margin-bottom: 8px; }
    .auth-container p { color: #b9b9c8; }
    .auth-container label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
    }
    .auth-container input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #444454;
      background: #20202b;
      color: white;
    }
    .auth-container button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }
    #authMessage { margin-top: 16px; overflow-wrap: anywhere; }
    .back-link { color: #c5a3ff; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">✦ Numelio</a>
  </header>

  <main class="auth-container">
    <h1>Tu espacio de estudio</h1>
    <p>Accede a tu cuenta o crea una nueva para empezar.</p>

    <form id="authForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="tu@correo.com" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password"
             autocomplete="current-password"
             minlength="8" placeholder="Mínimo 8 caracteres" required>

      <button type="submit" id="loginBtn">Iniciar sesión</button>
      <button type="button" id="signupBtn">Crear cuenta</button>
      <button type="button" id="logoutBtn" hidden>Cerrar sesión</button>
      <p id="authMessage" role="status" aria-live="polite"></p>
    </form>

    <p><a class="back-link" href="index.html">← Volver a Numelio</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script>
    const form = document.getElementById("authForm");
    const message = document.getElementById("authMessage");
    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");

    function getClient() {
      if (window.supabaseClient) return window.supabaseClient;
      if (window.numelioSupabase) return window.numelioSupabase;
      if (window.supabase && typeof window.supabase.auth?.signInWithPassword === "function") {
        return window.supabase;
      }
      return null;
    }

    function credentials() {
      return {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };
    }

    async function authenticate(mode) {
      message.textContent = "Conectando...";
      const client = getClient();

      if (!client) {
        message.textContent =
          "No se ha encontrado el cliente de Supabase. Hay que revisar js/supabase.js.";
        return;
      }

      const { email, password } = credentials();

      try {
        const result = mode === "signup"
          ? await client.auth.signUp({ email, password })
          : await client.auth.signInWithPassword({ email, password });

        if (result.error) throw result.error;

        if (mode === "signup" && !result.data.session) {
          message.textContent =
            "Cuenta creada. Revisa tu correo para confirmar la dirección antes de iniciar sesión.";
        } else {
          message.textContent =
            mode === "signup" ? "Cuenta creada correctamente." : "¡Has iniciado sesión! Abriendo tu espacio…";
          if (result.data.session) {
            window.location.href = "mi-espacio.html";
          }
        }
      } catch (error) {
        message.textContent = error.message || "No se ha podido completar la operación.";
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      await authenticate("login");
    });

    signupBtn.addEventListener("click", async () => {
      if (!form.reportValidity()) return;
      await authenticate("signup");
    });
        const logoutBtn = document.getElementById("logoutBtn");
    const sb = getClient();

    function showState(session) {
      const loggedIn = !!session;
      logoutBtn.hidden = !loggedIn;
      loginBtn.hidden = loggedIn;
      signupBtn.hidden = loggedIn;
      if (loggedIn) {
        message.textContent = "Sesión iniciada como " + session.user.email + ". Abriendo tu espacio…";
        window.location.replace("mi-espacio.html");
      }
    }

    if (sb) {
      sb.auth.getSession().then(({ data }) => showState(data.session));
      sb.auth.onAuthStateChange((_event, session) => showState(session));
    }

    logoutBtn.addEventListener("click", async () => {
      await getClient().auth.signOut();
      message.textContent = "Has cerrado sesión.";
    });
  </script>
</body>
</html>
