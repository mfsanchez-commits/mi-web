<!doctype html>
<html lang="es">
<head>
<link rel="canonical" href="https://mi-web-ej4w.onrender.com/cuenta.html">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceder a Numelio</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      max-width: 440px;
      margin: 60px auto;
      padding: 28px;
      border: 1px solid #30303b;
      border-radius: 18px;
      background: #15151d;
      color: #fff;
    }
    .auth-container h1 { margin-bottom: 8px; }
    .auth-container p { color: #b9b9c8; }
    .auth-container label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
    }
    .auth-container input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #444454;
      background: #20202b;
      color: white;
    }
    .auth-container button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }
    #authMessage { margin-top: 16px; overflow-wrap: anywhere; }
    .back-link { color: #c5a3ff; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">✦ Numelio</a>
  </header>

  <main class="auth-container">
    <h1>Tu espacio de estudio</h1>
    <p>Accede a tu cuenta o crea una nueva para empezar.</p>

    <form id="authForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="tu@correo.com" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password"
             autocomplete="current-password"
             minlength="8" placeholder="Mínimo 8 caracteres" required>

      <button type="submit" id="loginBtn">Iniciar sesión</button>
      <button type="button" id="signupBtn">Crear cuenta</button>
      <button type="button" id="forgotBtn">He olvidado mi contraseña</button>
      <button type="button" id="updatePasswordBtn" hidden>Guardar nueva contraseña</button>
      <p style="font-size:12px">La autenticación la gestiona Supabase; Numelio no guarda contraseñas en texto plano.</p>
      <button type="button" id="logoutBtn" hidden>Cerrar sesión</button>
      <p id="authMessage" role="status" aria-live="polite"></p>
    </form>

    <p><a class="back-link" href="index.html">← Volver a Numelio</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    const form = document.getElementById("authForm");
    const message = document.getElementById("authMessage");
    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const forgotBtn = document.getElementById("forgotBtn");
    const updatePasswordBtn = document.getElementById("updatePasswordBtn");
    const passwordLabel = document.querySelector('label[for="password"]');
    const resetMode = new URLSearchParams(window.location.search).get("reset") === "1";
    if (resetMode) {
      passwordLabel.textContent = "Nueva contraseña";
      document.getElementById("password").setAttribute("autocomplete", "new-password");
      loginBtn.hidden = true;
      signupBtn.hidden = true;
      forgotBtn.hidden = true;
      updatePasswordBtn.hidden = false;
      message.textContent = "Escribe una nueva contraseña de al menos 8 caracteres.";
    }

    function getClient() {
      if (window.supabaseClient) return window.supabaseClient;
      if (window.numelioSupabase) return window.numelioSupabase;
      if (window.supabase && typeof window.supabase.auth?.signInWithPassword === "function") {
        return window.supabase;
      }
      return null;
    }

    function credentials() {
      return {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };
    }

    async function authenticate(mode) {
      message.textContent = "Conectando...";
      const client = getClient();

      if (!client) {
        message.textContent =
          "No se ha encontrado el cliente de Supabase. Hay que revisar js/supabase.js.";
        return;
      }

      const { email, password } = credentials();

      try {
        const result = mode === "signup"
          ? await client.auth.signUp({ email, password })
          : await client.auth.signInWithPassword({ email, password });

        if (result.error) throw result.error;

        if (mode === "signup" && !result.data.session) {
          message.textContent =
            "Cuenta creada. Revisa tu correo para confirmar la dirección antes de iniciar sesión.";
        } else {
          message.textContent =
            mode === "signup" ? "Cuenta creada correctamente." : "¡Has iniciado sesión! Abriendo tu espacio…";
          if (result.data.session) {
            window.location.href = "mi-espacio.html";
          }
        }
      } catch (error) {
        message.textContent = error.message || "No se ha podido completar la operación.";
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (resetMode) { updatePasswordBtn.click(); return; }
      await authenticate("login");
    });

    forgotBtn.addEventListener("click", async () => {
      const client = getClient();
      const email = document.getElementById("email").value.trim();
      if (!email) {
        message.textContent = "Escribe primero tu correo electrónico y vuelve a pulsar este botón.";
        document.getElementById("email").focus();
        return;
      }
      if (!client) { message.textContent = "No se ha podido cargar el servicio de cuentas."; return; }
      forgotBtn.disabled = true;
      message.textContent = "Enviando instrucciones de recuperación…";
      try {
        const { error } = await client.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/cuenta.html?reset=1"
        });
        if (error) throw error;
        message.textContent = "Si existe una cuenta con ese correo, recibirás un enlace para cambiar la contraseña. Revisa también el correo no deseado.";
      } catch (error) {
        message.textContent = "No se ha podido enviar el correo de recuperación. Comprueba la dirección e inténtalo de nuevo.";
      } finally { forgotBtn.disabled = false; }
    });

    updatePasswordBtn.addEventListener("click", async () => {
      const client = getClient();
      const password = document.getElementById("password").value;
      if (password.length < 8) { message.textContent = "La nueva contraseña debe tener al menos 8 caracteres."; return; }
      updatePasswordBtn.disabled = true;
      message.textContent = "Actualizando contraseña…";
      try {
        const { error } = await client.auth.updateUser({ password });
        if (error) throw error;
        message.textContent = "Contraseña actualizada. Ya puedes seguir usando Numelio.";
        updatePasswordBtn.hidden = true;
        loginBtn.hidden = false;
        passwordLabel.textContent = "Contraseña";
        document.getElementById("password").value = "";
        window.history.replaceState({}, "", window.location.pathname);
      } catch (error) {
        message.textContent = "El enlace de recuperación puede haber caducado. Solicita uno nuevo e inténtalo otra vez.";
      } finally { updatePasswordBtn.disabled = false; }
    });

    signupBtn.addEventListener("click", async () => {
      if (!form.reportValidity()) return;
      await authenticate("signup");
    });
        const logoutBtn = document.getElementById("logoutBtn");
    const sb = getClient();

    function showState(session) {
      const loggedIn = !!session;
      logoutBtn.hidden = !loggedIn;
      loginBtn.hidden = loggedIn;
      signupBtn.hidden = loggedIn;
      if (loggedIn && resetMode) {
        message.textContent = "Sesión de recuperación activa. Escribe tu nueva contraseña y guárdala.";
      } else if (loggedIn) {
        message.textContent = "Sesión iniciada como " + session.user.email + ". Abriendo tu espacio…";
        window.location.replace("mi-espacio.html");
      }
    }

    if (sb) {
      sb.auth.getSession().then(({ data }) => showState(data.session));
      sb.auth.onAuthStateChange((_event, session) => showState(session));
    }

    logoutBtn.addEventListener("click", async () => {
      await getClient().auth.signOut();
      message.textContent = "Has cerrado sesión.";
    });
  </script>
<footer class="site-footer">✦ Numelio · <a href="politica-privacidad.html">Privacidad</a> · <a href="aviso-legal.html">Aviso legal</a> · <a href="politica-cookies.html">Cookies</a></footer>
</body>
</html>
