<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear examen con IA | Numelio</title><meta name="description" content="Sube tus apuntes y genera y corrige un examen con IA en Numelio."><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><a href="../index.html#herramientas">Herramientas</a><button id="themeBtn">☾</button></nav></header>
<main class="page"><span class="eyebrow">ZONA DE ESTUDIO · IA</span><h1>Convierte tus apuntes en un examen</h1><p style="color:var(--muted);line-height:1.6">Sube tus apuntes, elige cómo quieres practicar y Numelio generará y corregirá tu examen.</p>
<div class="calc"><label class="upload" for="file"><div style="font-size:38px">📚</div><b>Subir apuntes</b><p style="color:var(--muted)">PDF o TXT · hasta 10 MB</p><input id="file" type="file" accept=".pdf,.txt,application/pdf,text/plain"></label>
<div id="name" style="margin-top:12px;font-weight:700"></div><div id="status" style="margin-top:10px;color:var(--muted)"></div>
<div class="settings"><div class="field"><label>Asignatura</label><select id="subject"><option>Matemáticas</option><option>Lengua</option><option>Física y Química</option><option>Biología</option><option>Geografía e Historia</option><option>Francés</option><option>Otra</option></select></div><div class="field"><label>Preguntas</label><select id="count"><option>5</option><option>10</option><option>15</option><option>20</option></select></div><div class="field"><label>Dificultad</label><select id="difficulty"><option>Fácil</option><option>Media</option><option>Difícil</option></select></div></div>
<button id="generate" class="btn primary" style="margin-top:20px" disabled>✨ Generar examen con IA</button><div id="quiz"></div></div></main><script src="../js/app.js"></script>
<script>
const fileInput=document.getElementById('file'),nameEl=document.getElementById('name'),statusEl=document.getElementById('status'),generate=document.getElementById('generate'),quiz=document.getElementById('quiz');let selectedFile=null,currentExam=null;
fileInput.onchange=()=>{selectedFile=fileInput.files[0]||null;if(!selectedFile)return;nameEl.textContent='📄 '+selectedFile.name;statusEl.textContent='Archivo preparado. La IA lo leerá al generar el examen.';generate.disabled=false;};
generate.onclick=async()=>{if(!selectedFile)return;generate.disabled=true;generate.textContent='⏳ Generando…';statusEl.textContent='Numelio está leyendo tus apuntes y creando las preguntas…';quiz.innerHTML='';const fd=new FormData();fd.append('file',selectedFile);fd.append('subject',document.getElementById('subject').value);fd.append('count',document.getElementById('count').value);fd.append('difficulty',document.getElementById('difficulty').value);try{const r=await fetch('/api/generate-exam',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw new Error(data.error||'Error');currentExam=data;renderExam(data);statusEl.textContent='✅ Examen generado. ¡A practicar!';}catch(e){statusEl.textContent='❌ '+e.message;}finally{generate.disabled=false;generate.textContent='✨ Generar examen con IA';}};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function renderExam(exam){quiz.innerHTML='<h2 style="margin-top:30px">'+esc(exam.title||'Examen Numelio')+'</h2><p style="color:var(--muted)">'+esc(document.getElementById('subject').value)+' · '+exam.questions.length+' preguntas</p>'+exam.questions.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q.question)}</h3>${q.type==='choice'?q.options.map((o,j)=>`<label style="display:block;padding:9px 0"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join(''):'<textarea id="a'+i+'" rows="4" placeholder="Escribe tu respuesta…"></textarea>'}</div>`).join('')+'<button id="finish" class="btn primary">✓ Terminar y corregir</button><div id="score"></div>';document.getElementById('finish').onclick=grade;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
async function grade(){const answers=currentExam.questions.map((q,i)=>q.type==='choice'?Number(document.querySelector(`input[name="q${i}"]:checked`)?.value??-1):document.getElementById('a'+i)?.value||'');const btn=document.getElementById('finish');btn.disabled=true;btn.textContent='⏳ Corrigiendo…';try{const r=await fetch('/api/grade-exam',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:document.getElementById('subject').value,questions:currentExam.questions,answers})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Error');document.getElementById('score').innerHTML=`<div class="score"><h2 style="margin-top:0">Nota: ${esc(data.score)}/10</h2><p><b>${esc(data.correct)}/${esc(data.total)}</b> preguntas correctas.</p><p>${esc(data.summary||'Buen trabajo. Revisa los errores para seguir mejorando.')}</p><details><summary>Ver correcciones</summary>${(data.results||[]).map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${x.correct?'✅ Correcta':'❌ Para revisar'} · Pregunta ${Number(x.index)+1}</b><p>${esc(x.feedback)}</p>${x.expected?'<small><b>Respuesta esperada:</b> '+esc(x.expected)+'</small>':''}</div>`).join('')}</details><button class="btn" onclick="renderExam(currentExam)">🔄 Hacer otro intento</button></div>`;btn.remove();}catch(e){document.getElementById('score').innerHTML='<div class="score">❌ '+esc(e.message)+'</div>';btn.disabled=false;btn.textContent='✓ Terminar y corregir';}}
</script></body></html>
