<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis flashcards — Numelio</title><link rel="stylesheet" href="css/style.css">
<style>
.fc-page{max-width:1000px;margin:auto;padding:38px 20px 70px}.fc-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin:20px 0}.fc-field{margin:12px 0}.fc-field label{display:block;font-weight:700;margin-bottom:6px}.fc-field input,.fc-field select,.fc-field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.fc-card{border:1px solid var(--line);border-radius:16px;padding:22px;margin:12px 0;cursor:pointer;min-height:130px}.fc-answer{display:none;color:var(--primary);margin-top:15px}.fc-card.revealed .fc-answer{display:block}.fc-meta{color:var(--muted);font-size:13px}
</style></head><body><header class="topbar"><a class="brand" href="index.html">✦ Numelio</a><nav><a href="mi-espacio.html">Mi espacio</a><button id="themeBtn" type="button">☾</button></nav></header>
<main class="fc-page"><span class="eyebrow">ZONA DE ESTUDIO</span><h1>Mis flashcards</h1><p class="fc-meta">Genera tarjetas desde tus apuntes o una foto y guárdalas para repasarlas otro día. Pulsa una tarjeta para ver la respuesta.</p>
<section class="fc-panel"><h2>Crear tarjetas con IA</h2><div class="fc-field"><label for="title">Nombre del conjunto</label><input id="title" maxlength="120" placeholder="Ej. Primera Guerra Mundial" required></div><div class="fc-field"><label for="subject">Asignatura</label><select id="subject"><option>Matemáticas</option><option>Lengua</option><option>Física y Química</option><option>Biología</option><option>Geografía e Historia</option><option>Francés</option><option>Otra</option></select></div><div class="fc-field"><label for="source">Texto de apuntes (opcional si subes un archivo)</label><textarea id="source" rows="5" placeholder="Pega aquí tus apuntes..."></textarea></div><div class="fc-field"><label for="file">O subir foto/PDF/TXT (máximo 10 MB)</label><input id="file" type="file" accept=".pdf,.txt,.jpg,.jpeg,.png,.webp,application/pdf,text/plain,image/jpeg,image/png,image/webp"></div><button id="create" class="btn primary" type="button">✨ Generar y guardar tarjetas</button><p id="status" class="fc-meta" role="status">Comprueba que has iniciado sesión.</p></section>
<section class="fc-panel"><h2>Mis conjuntos guardados</h2><div id="sets" class="fc-meta">Cargando…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>
const sb=window.numelioSupabase, statusEl=document.getElementById("status"), createBtn=document.getElementById("create"), setsEl=document.getElementById("sets");let user=null;
const theme=localStorage.getItem("numelio-theme");if(theme==="dark")document.documentElement.classList.add("dark");document.getElementById("themeBtn").onclick=()=>{document.documentElement.classList.toggle("dark");localStorage.setItem("numelio-theme",document.documentElement.classList.contains("dark")?"dark":"light")};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function loadSets(){const {data,error}=await sb.from("flashcards").select("id,titulo,asignatura,tarjetas,created_at").eq("user_id",user.id).order("created_at",{ascending:false});if(error){setsEl.textContent="Activa la tabla flashcards con el SQL de Numelio y recarga esta página.";return;}if(!data.length){setsEl.textContent="Todavía no has guardado ningún conjunto.";return;}setsEl.innerHTML=data.map(s=>'<article class="fc-card"><b>'+esc(s.titulo)+'</b><p class="fc-meta">'+esc(s.asignatura)+' · '+s.tarjetas.length+' tarjetas</p><div class="fc-review"></div><button type="button" class="btn" data-delete="'+s.id+'">Eliminar conjunto</button></article>').join("");[...setsEl.querySelectorAll(".fc-card")].forEach((el,i)=>{const set=data[i],review=el.querySelector(".fc-review");let n=0;const show=()=>{if(n>=set.tarjetas.length){review.innerHTML="<p>¡Has terminado este conjunto!</p><button type='button' class='btn' data-restart>Repasar otra vez</button>";return;}review.innerHTML='<p><b>Pregunta '+(n+1)+' de '+set.tarjetas.length+'</b></p><div class="fc-card" data-flip><b>'+esc(set.tarjetas[n].question)+'</b><div class="fc-answer"><p>'+esc(set.tarjetas[n].answer)+'</p></div><p class="fc-meta">Pulsa para ver la respuesta</p></div><button type="button" class="btn" data-next>Siguiente →</button>';review.querySelector("[data-flip]").onclick=e=>e.currentTarget.classList.toggle("revealed");review.querySelector("[data-next]").onclick=()=>{n++;show()};review.querySelector("[data-flip]").innerHTML+='<style>.fc-card.revealed .fc-answer{display:block}</style>';};el.querySelector("b").onclick=()=>{review.innerHTML="";show()};el.querySelector("[data-delete]").onclick=async()=>{if(!confirm("¿Eliminar este conjunto de flashcards?"))return;await sb.from("flashcards").delete().eq("id",set.id).eq("user_id",user.id);loadSets()};});}
(async()=>{if(!sb){statusEl.textContent="No se ha podido cargar Supabase.";return;}const {data}=await sb.auth.getSession();if(!data.session){location.replace("cuenta.html");return;}user=data.session.user;await loadSets();statusEl.textContent="Sesión iniciada.";})();
createBtn.onclick=async()=>{const title=document.getElementById("title").value.trim(),source=document.getElementById("source").value.trim(),file=document.getElementById("file").files[0];if(!title||(!source&&!file)){statusEl.textContent="Escribe un nombre y añade texto o un archivo.";return;}if(file&&file.size>10*1024*1024){statusEl.textContent="El archivo supera los 10 MB.";return;}createBtn.disabled=true;statusEl.textContent="Leyendo los apuntes y generando tarjetas…";try{const fd=new FormData();if(file)fd.append("file",file);if(source)fd.append("notesText",source);fd.append("subject",document.getElementById("subject").value);const r=await fetch("/api/generate-flashcards",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||"No se pudieron generar las tarjetas.");const {error}=await sb.from("flashcards").insert({user_id:user.id,asignatura:document.getElementById("subject").value,titulo:title,tarjetas:d.cards});if(error)throw error;statusEl.textContent="¡Tarjetas generadas y guardadas en tu cuenta!";document.getElementById("source").value="";document.getElementById("file").value="";await loadSets();}catch(e){statusEl.textContent="Error: "+(e.message||"No se pudieron guardar las tarjetas.");}finally{createBtn.disabled=false;}};
setsEl.addEventListener("click",e=>{if(e.target.matches("[data-restart]"))loadSets();});
</script></body></html>
