<!doctype html><html lang="es"><head>
<link rel="canonical" href="https://mi-web-ej4w.onrender.com/matematicas/descuentos.html"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de descuentos | Numelio</title><link rel="stylesheet" href="../css/style.css"></head><body>
<header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><button id="themeBtn">☾</button></nav></header><main class="page"><span class="eyebrow">MATEMÁTICAS</span><h1>Calculadora de descuentos</h1><p style="color:var(--muted)">Calcula el precio final y cuánto dinero ahorras.</p><div class="calc"><div class="form"><div class="field"><label for="price">Precio original (€)</label><input id="price" type="text" inputmode="decimal" step="any"></div><div class="field"><label for="disc">Descuento (%)</label><input id="disc" type="text" inputmode="decimal" step="any"></div><div class="full"><button class="btn primary" id="go">Calcular</button></div></div><div id="r" class="result" hidden></div></div></main><script src="../js/app.js"></script><script>
const parseDiscountValue = value => {
  const normalized = value.trim().replace(",", ".");
  return normalized !== "" && Number.isFinite(Number(normalized)) ? Number(normalized) : NaN;
};
document.getElementById("go").onclick = () => {
  const p = parseDiscountValue(document.getElementById("price").value);
  const d = parseDiscountValue(document.getElementById("disc").value);
  const r = document.getElementById("r");
  r.hidden = false;
  if (!Number.isFinite(p) || !Number.isFinite(d) || p < 0 || d < 0 || d > 100) {
    r.textContent = "Introduce un precio igual o superior a cero y un descuento entre 0 y 100 %.";
    return;
  }
  const save = p * d / 100;
  r.innerHTML = "<strong>" + (p - save).toFixed(2) + " €</strong><p>Ahorras " + save.toFixed(2) + " €.</p>";
};
</script><footer class="site-footer">✦ Numelio · <a href="../politica-privacidad.html">Privacidad</a> · <a href="../aviso-legal.html">Aviso legal</a> · <a href="../politica-cookies.html">Cookies</a></footer>
</body></html>
