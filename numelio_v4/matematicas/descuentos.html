<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de descuentos | Numelio</title><link rel="stylesheet" href="../css/style.css"></head><body>
<header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><button id="themeBtn">☾</button></nav></header><main class="page"><span class="eyebrow">MATEMÁTICAS</span><h1>Calculadora de descuentos</h1><p style="color:var(--muted)">Calcula el precio final y cuánto dinero ahorras.</p><div class="calc"><div class="form"><div class="field"><label>Precio original (€)</label><input id="price" type="number" step="any"></div><div class="field"><label>Descuento (%)</label><input id="disc" type="number" step="any"></div><div class="full"><button class="btn primary" id="go">Calcular</button></div></div><div id="r" class="result" hidden></div></div></main><script src="../js/app.js"></script><script>go.onclick=()=>{let p=+price.value,d=+disc.value,r=document.getElementById('r');if(!Number.isFinite(p)||!Number.isFinite(d)||d<0||d>100){r.hidden=false;r.textContent='Introduce valores válidos.';return}let save=p*d/100;r.hidden=false;r.innerHTML='<strong>'+(p-save).toFixed(2)+' €</strong><p>Ahorras '+save.toFixed(2)+' €.</p>'}</script></body></html>
