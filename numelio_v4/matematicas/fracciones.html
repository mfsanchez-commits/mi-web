<!doctype html><html lang="es"><head>
<link rel="canonical" href="https://numelio.es/matematicas/fracciones.html"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de fracciones | Numelio</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><button id="themeBtn">☾</button></nav></header><main class="page"><span class="eyebrow">MATEMÁTICAS</span><h1>Calculadora de fracciones</h1><div class="calc"><div class="form"><div class="field"><label for="a">Numerador 1</label><input id="a" type="number"></div><div class="field"><label for="b">Denominador 1</label><input id="b" type="number" value="1"></div><div class="field"><label for="c">Numerador 2</label><input id="c" type="number"></div><div class="field"><label for="d">Denominador 2</label><input id="d" type="number" value="1"></div><div class="field"><label for="op">Operación</label><select id="op"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select></div><div class="full"><button class="btn primary" id="go">Calcular</button></div></div><div id="r" class="result" hidden></div></div></main><script src="../js/app.js"></script><script>
const $=id=>document.getElementById(id);
const parse=id=>{const s=$(id).value.trim();return s!==""&&/^-?\d+$/.test(s)?Number(s):NaN;};
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1;}
$("go").onclick=()=>{const A=parse("a"),B=parse("b"),C=parse("c"),D=parse("d"),O=$("op").value,r=$("r");r.hidden=false;if([A,B,C,D].some(Number.isNaN)||B===0||D===0||(O==="/"&&C===0)){r.textContent="Introduce numeradores enteros y denominadores enteros distintos de cero. No se puede dividir entre cero.";return;}let n,den;if(O==="+"){n=A*D+C*B;den=B*D;}else if(O==="-"){n=A*D-C*B;den=B*D;}else if(O==="*"){n=A*C;den=B*D;}else{n=A*D;den=B*C;}if(den<0){n=-n;den=-den;}const z=gcd(n,den);r.innerHTML="<strong>"+(n/z)+" / "+(den/z)+"</strong><p>Resultado simplificado.</p>";};
</script><footer class="site-footer">✦ Numelio · <a href="../politica-privacidad.html">Privacidad</a> · <a href="../aviso-legal.html">Aviso legal</a> · <a href="../politica-cookies.html">Cookies</a> · <a href="../condiciones.html">Condiciones</a></footer>
</body></html>
