<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de fracciones | Numelio</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><button id="themeBtn">☾</button></nav></header><main class="page"><span class="eyebrow">MATEMÁTICAS</span><h1>Calculadora de fracciones</h1><div class="calc"><div class="form"><div class="field"><label>Numerador 1</label><input id="a" type="number"></div><div class="field"><label>Denominador 1</label><input id="b" type="number" value="1"></div><div class="field"><label>Numerador 2</label><input id="c" type="number"></div><div class="field"><label>Denominador 2</label><input id="d" type="number" value="1"></div><div class="field"><label>Operación</label><select id="op"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select></div><div class="full"><button class="btn primary" id="go">Calcular</button></div></div><div id="r" class="result" hidden></div></div></main><script src="../js/app.js"></script><script>function g(a,b){a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1}go.onclick=()=>{let A=+a.value,B=+b.value,C=+c.value,D=+d.value,O=op.value,r=document.getElementById('r');if(![A,B,C,D].every(Number.isFinite)||B===0||D===0||(O==='/'&&C===0)){r.hidden=false;r.textContent='Revisa los valores.';return}let n,den;if(O==='+'){n=A*D+C*B;den=B*D}else if(O==='-'){n=A*D-C*B;den=B*D}else if(O==='*'){n=A*C;den=B*D}else{n=A*D;den=B*C}if(den<0){n=-n;den=-den}let z=g(n,den);r.hidden=false;r.innerHTML='<strong>'+(n/z)+' / '+(den/z)+'</strong><p>Resultado simplificado.</p>'}</script></body></html>
