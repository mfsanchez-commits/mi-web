<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de IVA | Numelio</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><button id="themeBtn">☾</button></nav></header><main class="page"><span class="eyebrow">HERRAMIENTAS</span><h1>Calculadora de IVA</h1><div class="calc"><div class="form"><div class="field"><label for="price">Precio (€)</label><input id="price" type="text" inputmode="decimal" step="any"></div><div class="field"><label for="tax">IVA (%)</label><input id="tax" type="text" inputmode="decimal" value="21" step="any"></div><div class="field"><label>Operación</label><select id="op"><option value="add">Añadir IVA</option><option value="remove">Extraer IVA incluido</option></select></div><div class="full"><button class="btn primary" id="go">Calcular</button></div></div><div id="r" class="result" hidden></div></div></main><script src="../js/app.js"></script><script>
const $=id=>document.getElementById(id);
const parse=id=>{const s=$(id).value.trim().replace(",",".");return s!==""&&Number.isFinite(Number(s))?Number(s):NaN;};
$("go").onclick=()=>{const p=parse("price"),v=parse("tax"),r=$("r");r.hidden=false;if(Number.isNaN(p)||Number.isNaN(v)||p<0||v<0||v>100){r.textContent="Introduce un precio igual o superior a cero y un IVA entre 0 y 100 %.";return;}let base,total,iva;if($("op").value==="add"){base=p;iva=p*v/100;total=p+iva;}else{if(v===100){r.textContent="No se puede extraer el IVA con un tipo del 100 % o superior.";return;}total=p;base=p/(1+v/100);iva=total-base;}r.innerHTML="<strong>"+total.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €</strong><p>Base: "+base.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" € · IVA: "+iva.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €</p>";};
</script></body></html>
