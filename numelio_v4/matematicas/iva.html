<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de IVA | Numelio</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><button id="themeBtn">☾</button></nav></header><main class="page"><span class="eyebrow">HERRAMIENTAS</span><h1>Calculadora de IVA</h1><div class="calc"><div class="form"><div class="field"><label>Precio (€)</label><input id="price" type="number" step="any"></div><div class="field"><label>IVA (%)</label><input id="tax" type="number" value="21" step="any"></div><div class="field"><label>Operación</label><select id="op"><option value="add">Añadir IVA</option><option value="remove">Extraer IVA incluido</option></select></div><div class="full"><button class="btn primary" id="go">Calcular</button></div></div><div id="r" class="result" hidden></div></div></main><script src="../js/app.js"></script><script>go.onclick=()=>{let p=+price.value,v=+tax.value,r=document.getElementById('r');if(!Number.isFinite(p)||!Number.isFinite(v)||p<0){r.hidden=false;r.textContent='Introduce valores válidos.';return}let base,total,iva;if(op.value==='add'){base=p;iva=p*v/100;total=p+iva}else{total=p;base=p/(1+v/100);iva=total-base}r.hidden=false;r.innerHTML='<strong>'+total.toFixed(2)+' €</strong><p>Base: '+base.toFixed(2)+' € · IVA: '+iva.toFixed(2)+' €</p>'}</script></body></html>
