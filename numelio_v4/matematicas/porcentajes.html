<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de porcentajes | Numelio</title><link rel="stylesheet" href="../css/style.css"></head><body>
<header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><a href="../estudio/examen.html">Examen</a><button id="themeBtn">☾</button></nav></header>
<main class="page"><span class="eyebrow">MATEMÁTICAS</span><h1>Calculadora de porcentajes</h1><p style="color:var(--muted)">Calcula rápidamente un porcentaje de una cantidad.</p><div class="calc"><div class="form"><div class="field"><label>Cantidad</label><input id="a" type="number" step="any"></div><div class="field"><label>Porcentaje</label><input id="p" type="number" step="any"></div><div class="full"><button class="btn primary" id="go">Calcular</button></div></div><div id="r" class="result" hidden></div></div></main><script src="../js/app.js"></script><script>go.onclick=()=>{let a=+document.getElementById('a').value,p=+document.getElementById('p').value,r=document.getElementById('r');if(!Number.isFinite(a)||!Number.isFinite(p)){r.hidden=false;r.textContent='Introduce valores válidos.';return}let x=a*p/100;r.hidden=false;r.innerHTML='<strong>'+x+'</strong><p>'+p+'% de '+a+' es '+x+'.</p>'}</script></body></html>
