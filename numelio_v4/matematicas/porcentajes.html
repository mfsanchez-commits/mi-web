<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de porcentajes | Numelio</title><link rel="stylesheet" href="../css/style.css"></head><body>
<header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><a href="../estudio/examen.html">Examen</a><button id="themeBtn">☾</button></nav></header>
<main class="page"><span class="eyebrow">MATEMÁTICAS</span><h1>Calculadora de porcentajes</h1><p style="color:var(--muted)">Calcula rápidamente un porcentaje de una cantidad.</p><div class="calc"><div class="form"><div class="field"><label for="a">Cantidad</label><input id="a" type="text" inputmode="decimal" step="any"></div><div class="field"><label for="p">Porcentaje</label><input id="p" type="text" inputmode="decimal" step="any"></div><div class="full"><button class="btn primary" id="go">Calcular</button></div></div><div id="r" class="result" hidden></div></div></main><script src="../js/app.js"></script><script>
const $=id=>document.getElementById(id);
const parse=id=>{const s=$(id).value.trim().replace(",",".");return s!==""&&Number.isFinite(Number(s))?Number(s):NaN;};
$("go").onclick=()=>{const a=parse("a"),p=parse("p"),r=$("r");r.hidden=false;if(Number.isNaN(a)||Number.isNaN(p)){r.textContent="Introduce una cantidad y un porcentaje válidos.";return;}const x=a*p/100;r.innerHTML="<strong>"+x.toLocaleString("es-ES",{maximumFractionDigits:8})+"</strong><p>"+p.toLocaleString("es-ES")+" % de "+a.toLocaleString("es-ES")+" es "+x.toLocaleString("es-ES")+".</p>";};
</script></body></html>
