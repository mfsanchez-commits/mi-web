<!doctype html><html lang="es"><head>
<link rel="canonical" href="https://mi-web-ej4w.onrender.com/matematicas/regla-de-tres.html"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regla de tres | Numelio</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><button id="themeBtn">☾</button></nav></header><main class="page"><span class="eyebrow">MATEMÁTICAS</span><h1>Regla de tres</h1><div class="calc"><div class="form"><div class="field"><label for="a">A</label><input id="a" type="text" inputmode="decimal"></div><div class="field"><label for="b">B</label><input id="b" type="text" inputmode="decimal"></div><div class="field"><label for="c">C</label><input id="c" type="text" inputmode="decimal"></div><div class="full"><button class="btn primary" id="go">Resolver</button></div></div><div id="r" class="result" hidden></div></div></main><script src="../js/app.js"></script><script>
const $=id=>document.getElementById(id);
const parse=id=>{const s=$(id).value.trim().replace(",",".");return s!==""&&Number.isFinite(Number(s))?Number(s):NaN;};
$("go").onclick=()=>{const A=parse("a"),B=parse("b"),C=parse("c"),r=$("r");r.hidden=false;if([A,B,C].some(Number.isNaN)||A===0){r.textContent="Introduce los tres valores. A no puede ser cero porque se usa como divisor.";return;}const x=B*C/A;r.innerHTML="<strong>X = "+x.toLocaleString("es-ES",{maximumFractionDigits:8})+"</strong><p>X = (B × C) / A</p>";};
</script><footer class="site-footer">✦ Numelio · <a href="../politica-privacidad.html">Privacidad</a> · <a href="../aviso-legal.html">Aviso legal</a> · <a href="../politica-cookies.html">Cookies</a></footer>
</body></html>
