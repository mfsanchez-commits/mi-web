<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regla de tres | Numelio</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html">✦ Numelio</a><nav><a href="../index.html">Inicio</a><button id="themeBtn">☾</button></nav></header><main class="page"><span class="eyebrow">MATEMÁTICAS</span><h1>Regla de tres</h1><div class="calc"><div class="form"><div class="field"><label>A</label><input id="a" type="number"></div><div class="field"><label>B</label><input id="b" type="number"></div><div class="field"><label>C</label><input id="c" type="number"></div><div class="full"><button class="btn primary" id="go">Resolver</button></div></div><div id="r" class="result" hidden></div></div></main><script src="../js/app.js"></script><script>go.onclick=()=>{let A=+a.value,B=+b.value,C=+c.value,r=document.getElementById('r');if(!Number.isFinite(A)||A===0||!Number.isFinite(B)||!Number.isFinite(C)){r.hidden=false;r.textContent='Introduce valores válidos.';return}let x=B*C/A;r.hidden=false;r.innerHTML='<strong>X = '+x+'</strong><p>X = (B × C) / A</p>'}</script></body></html>
